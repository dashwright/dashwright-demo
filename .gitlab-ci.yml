stages:
  - test
  # - cleanup

# Global Cache Configuration
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - node_modules/

# 🎭 Playwright (TypeScript) Job
playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  timeout: 60 minutes
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - mkdir -p test-reports/playwright-report test-reports/monocart-report
    - npx playwright test
    # Note: CTRF reporting usually has a GitLab-specific CLI or you can just store the JSON
  artifacts:
    when: always
    name: "playwright-report"
    paths:
      - test-reports/playwright-report/
      - test-reports/monocart-report/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev")
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" # 'workflow_dispatch'

# 🔷 Cypress (JavaScript) Job
cypress:
  stage: test
  image: node:24-bookworm
  timeout: 60 minutes
  before_script:
    - apt-get update && apt-get install -y xvfb libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth python3 python3-pip
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm exec cypress install
  script:
    # simple report
    # - mkdir -p test-reports/cypress-report
    # - npx cypress run --browser electron --reporter mocha-junit-reporter --reporter-options "mochaFile=test-reports/cypress-report/test-results.xml,toConsole=true"
    # - node scripts/generate-cypress-html.js
    # mochaawesome
    - mkdir -p test-reports/cypress-mochawesome
    - pnpm exec cypress run --browser electron --reporter mochawesome --reporter-options "reportDir=test-reports/cypress-mochawesome,reportFilename=index,overwrite=true,html=true,json=true,quiet=true"

  artifacts:
    when: always
    name: "cypress-report"
    paths:
      # - test-reports/cypress-report/
      - test-reports/cypress-mochawesome/
    expire_in: 180 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev")
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

